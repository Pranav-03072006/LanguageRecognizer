name: PolyGlot AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint, Model Train Verification & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code linting (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,staticfiles,.git,__pycache__
          # Check PEP8 compliance and line length
          flake8 . --count --max-line-length=127 --statistics --exclude=venv,staticfiles,.git,__pycache__

      - name: Verify Model Training Pipeline (Sample Dataset)
        run: |
          python train_model.py \
            --data-path data/sample_dataset.csv \
            --output-path artifacts/language_recognizer.joblib \
            --test-size 0.2 \
            --random-state 42

      - name: Run Django Unit Tests (Mocked LLM APIs)
        env:
          SECRET_KEY: test-ci-secret-key-for-github-actions
          DEBUG: "True"
          LLM_PROVIDER: "gemini"
          LLM_API_KEY: ""
        run: |
          python manage.py test detector --verbosity=2

  docker-build:
    name: Validate Docker Container Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: polyglot-language-recognizer:latest
