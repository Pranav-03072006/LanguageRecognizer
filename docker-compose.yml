version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyglot-language-recognizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - PORT=8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
